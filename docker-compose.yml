version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: pragma-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: payments
    volumes:
      - mongodb_data:/data/db
    networks:
      - pragma-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: pragma-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - pragma-network
    healthcheck:
      test: nc -z localhost 2181 || exit 1
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: pragma-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
      KAFKA_NUM_PARTITIONS: 3
    networks:
      - pragma-network
    healthcheck:
      test: kafka-topics --bootstrap-server localhost:9092 --list
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: pragma-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: pragma-kafka
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    networks:
      - pragma-network

  payment-service:
    build:
      context: ./payment-service
      dockerfile: Dockerfile
    container_name: pragma-payment-service
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATA_MONGODB_URI: mongodb://admin:admin123@mongodb:27017/payments?authSource=admin
      SPRING_DATA_MONGODB_DATABASE: payments
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SERVER_PORT: 8081
      EUREKA_CLIENT_ENABLED: "false"
      SPRING_CLOUD_GATEWAY_URI: http://api-gateway:8080
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - pragma-network
    healthcheck:
      test: curl -f http://localhost:8081/actuator/health || exit 1
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  fraud-service:
    build:
      context: ./fraud-service
      dockerfile: Dockerfile
    container_name: pragma-fraud-service
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATA_MONGODB_URI: mongodb://admin:admin123@mongodb:27017/fraud?authSource=admin
      SPRING_DATA_MONGODB_DATABASE: fraud
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SERVER_PORT: 8082
      EUREKA_CLIENT_ENABLED: "false"
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - pragma-network
    healthcheck:
      test: curl -f http://localhost:8082/actuator/health || exit 1
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: pragma-api-gateway
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_CLOUD_GATEWAY_ROUTES_0_ID: payment-service
      SPRING_CLOUD_GATEWAY_ROUTES_0_URI: http://payment-service:8081
      SPRING_CLOUD_GATEWAY_ROUTES_0_PREDICATHES_0: Path=/api/payments/**
      SPRING_CLOUD_GATEWAY_ROUTES_1_ID: fraud-service
      SPRING_CLOUD_GATEWAY_ROUTES_1_URI: http://fraud-service:8082
      SPRING_CLOUD_GATEWAY_ROUTES_1_PREDICATHES_1: Path=/api/fraud/**
      EUREKA_CLIENT_ENABLED: "false"
    depends_on:
      payment-service:
        condition: service_healthy
      fraud-service:
        condition: service_healthy
    networks:
      - pragma-network
    healthcheck:
      test: curl -f http://localhost:8080/actuator/health || exit 1
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  mongodb_data:
    driver: local

networks:
  pragma-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16